name: Coleta pontual - triagem RF vs CDI e lista XP
on:
  push:
    branches: [claude/project-thread-xfv1i8]
    paths: [".github/coleta/triagem_rf.py", ".github/coleta/xp_probe.py", ".github/workflows/triagem-rf-xp.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/coleta/xp_probe.py || true
      - run: python .github/coleta/triagem_rf.py
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add saida && git commit -m "Saida da triagem RF vs CDI" && git pull --rebase && git push

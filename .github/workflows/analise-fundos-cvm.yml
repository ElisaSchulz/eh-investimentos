name: Coleta pontual - analise de fundos (CVM)
on:
  push:
    branches: [claude/project-thread-tx0f2a]
    paths: [".github/coleta/analise_fundos.py", ".github/workflows/analise-fundos-cvm.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/coleta/analise_fundos.py
      - run: |
          wc -l saida/analise_fundos.txt; grep "^#" saida/analise_fundos.txt | head -40
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add saida && git commit -m "Saida da coleta de fundos (analise de carteira)" && git push

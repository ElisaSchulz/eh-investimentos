name: Teste FIDC (temporário)
on:
  push:
    branches: [claude/project-thread-39qhdi]
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r tarefas-mensais/requirements.txt
      - run: python .github/teste/teste_fidc.py 2>&1 | grep -E "^(FIDC|CONF|Traceback|  File|[A-Za-z]*Error)"

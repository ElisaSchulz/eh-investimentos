name: Tarefas mensais

# Roda as tarefas mensais (dados e rascunho da carta, indicadores, cotas e ETFs) e guarda os arquivos
# no bucket privado "tarefas-mensais" do Supabase, onde a aba Tarefas Mensais do
# admin mostra para baixar. Nada gerado fica no GitHub: o repositório é público.
on:
  schedule:
    # O GitHub não sabe o que é dia útil: o workflow acorda nos dias 1 a 8, 7h de Brasília,
    # e o job "quando" (dia_util.py) só deixa rodar no 3º dia útil do mês.
    - cron: "0 10 1-8 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês de referência (AAAA-MM). Vazio = mês anterior"
        required: false
        default: ""
      tarefas:
        description: "Tarefas separadas por vírgula. Vazio = todas (carta_mensal, carta_ia, indicadores_americanos, cotas_fundos, cotas_b3, etfs, dados_planilha, cra_eventos, rendimentos_fiis)"
        required: false
        default: ""
      data_inicio:
        description: "Só cotas B3, planilha, CRA/CRI e FIIs: data inicial (AAAA-MM-DD)"
        required: false
        default: ""
      data_fim:
        description: "Só cotas B3, planilha, CRA/CRI e FIIs: data final (AAAA-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tarefas-mensais
  cancel-in-progress: false

jobs:
  quando:
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.dia.outputs.rodar }}
    steps:
      - uses: actions/checkout@v5
      - id: dia
        env:
          TZ: America/Sao_Paulo
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tarefas-mensais/dia_util.py
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  rodar:
    needs: quando
    if: needs.quando.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: tarefas-mensais
    env:
      SUPABASE_URL: https://migyqowqjfhvdcrtryms.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MES_REFERENCIA: ${{ inputs.mes }}
      TAREFAS: ${{ inputs.tarefas }}
      DATA_INICIO: ${{ inputs.data_inicio }}
      DATA_FIM: ${{ inputs.data_fim }}
      TZ: America/Sao_Paulo
      # O mstarpy abre o Chrome para pegar os cookies do Morningstar. O runner não tem
      # tela, então ele roda numa tela virtual (xvfb-run) com estas opções.
      SELENIUM_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tarefas-mensais/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -q -r requirements.txt
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          # navegador do Playwright para ANBIMA, Riza e Oliveira Trust (juros de CRA/CRI)
          python -m playwright install --with-deps chromium > /dev/null
          google-chrome --version

      - name: Mês de referência
        run: |
          if [ -z "$MES_REFERENCIA" ]; then
            MES_REFERENCIA=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m)
          fi
          echo "MES_REFERENCIA=$MES_REFERENCIA" >> "$GITHUB_ENV"
          echo "PASTA_SAIDA=$RUNNER_TEMP/saida" >> "$GITHUB_ENV"
          echo "Mês de referência: $MES_REFERENCIA"

      - name: Status anterior do mês
        if: env.TAREFAS != ''
        run: python supabase_storage.py status "$PASTA_SAIDA" "$MES_REFERENCIA"

      - name: Rodar tarefas
        id: rodar
        continue-on-error: true
        run: xvfb-run -a python rodar_todas.py

      - name: Enviar arquivos para o Supabase
        if: always()
        run: python supabase_storage.py enviar "$PASTA_SAIDA" "$MES_REFERENCIA"

      - name: Falhar se alguma tarefa falhou
        if: steps.rodar.outcome == 'failure'
        run: |
          echo "Alguma tarefa falhou. Veja o passo 'Rodar tarefas' e o status.json no admin."
          exit 1

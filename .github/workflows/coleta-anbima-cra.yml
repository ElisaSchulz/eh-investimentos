name: Coleta pontual ANBIMA CRA
on:
  push:
    branches: [claude/project-thread-ovka9q]
    paths: [".github/coleta/**", ".github/workflows/coleta-anbima-cra.yml"]
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/coleta/anbima_cra.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add saida && git commit -m "Saída da coleta ANBIMA" && git push

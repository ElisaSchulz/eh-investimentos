name: Teste coleta da planilha de dados (temporário)
on:
  push:
    branches: [claude/project-thread-39qhdi]
    paths: ["tarefas-mensais/dados_planilha.py", ".github/workflows/teste-dados-planilha.yml"]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tarefas-mensais
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PASTA_SAIDA: ${{ runner.temp }}/saida
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy openpyxl fredapi
      - run: python dados_planilha.py
        env:
          MES_REFERENCIA: "2026-09"
      - name: Mostrar resultado
        run: |
          python - <<'PY'
          import os, pandas as pd
          p = os.path.join(os.environ["PASTA_SAIDA"], "atualizacao_dados_setembro_2026.xlsx")
          x = pd.read_excel(p, sheet_name=None)
          for k, v in x.items():
              print("=====", k, v.shape)
          print(x["Importar"].to_csv(sep=";", index=False))
          print(x["Conferência"].to_csv(sep=";", index=False))
          PY

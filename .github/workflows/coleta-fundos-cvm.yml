name: Coleta pontual de fundos CVM
on:
  push:
    branches: [claude/project-thread-sascp9]
    paths: [".github/coleta/**", ".github/workflows/coleta-fundos-cvm.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/coleta/fundos_cvm.py
      - run: |
          grep -c . saida/coleta.txt; grep "^# " saida/coleta.txt | head -50
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add saida && git commit -m "Saída da coleta CVM" && git push
